name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua51:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Verify Lua 5.1 release quality
        run: bash scripts/check-lua51.sh
      - name: Run informational benchmarks
        run: |
          lua5.1 benchmark.lua 5 | tee benchmark-results.txt
          lua5.1 scripts/benchmark-vm.lua 5 | tee benchmark-vm.csv
      - uses: actions/upload-artifact@v4
        with:
          name: lua51-benchmark-results
          path: |
            benchmark-results.txt
            benchmark-vm.csv
          if-no-files-found: error
