name: Create GitHub Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Verify Lua 5.1 release quality
        run: bash scripts/check-lua51.sh
      - name: Publish release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${TAG#v}"
          test "$(lua5.1 azure_obf.lua --version)" = "AzureVM $TAG"
          awk -v version="$VERSION" '
            /^## \[/ {
              if (printing) exit
              printing = index($0, "## [" version "]") == 1
            }
            printing { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --verify-tag --title "AzureVM $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
