name: Create GitHub Release

on:
  push:
    tags: ['v1.0.0']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Verify Lua 5.1 release quality
        run: bash scripts/check-lua51.sh
      - name: Publish release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "AzureVM $TAG" --notes-file CHANGELOG.md
